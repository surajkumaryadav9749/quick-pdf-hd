<!doctype html>

  <head>
    <!-- Load analytics after the page is interactive so it does not block initial rendering. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      window.addEventListener("load", () => {
        let analyticsLoaded = false;

        const loadAnalytics = () => {
          if (analyticsLoaded) return;

          analyticsLoaded = true;
          const script = document.createElement("script");
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-GCSX9ZGCL1";
          script.async = true;
          document.head.appendChild(script);

          gtag("js", new Date());
          gtag("config", "G-GCSX9ZGCL1");
        };

        ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
          window.addEventListener(eventName, loadAnalytics, {
            once: true,
            passive: true,
          });
        });

        window.setTimeout(loadAnalytics, 10000);
      });
    </script>
    <meta charset="UTF-8" />
